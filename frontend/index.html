<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Hostel Meals</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">🍽️ Hostel Meals</div>
    <div id="userChip" class="user-chip" style="display:none">
      <span id="userName"></span>
      <button id="switchBtn">⇄</button>
    </div>
  </header>

  <div id="loginBox" class="login-box">
    <div class="login-icon">🏠</div>
    <h2>Welcome</h2>
    <p class="sub">Enter your Student ID to vote for meals</p>
    <input id="idInput" placeholder="e.g. S101" autocomplete="off"/>
    <button id="loginBtn" class="primary-btn">Continue →</button>
    <p class="hint">Demo: S101 · S102 · S103</p>
  </div>

  <main id="mealsBox"></main>
  <div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
