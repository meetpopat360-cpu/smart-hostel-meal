<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Cook Dashboard</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">👨‍🍳 Cook Dashboard</div>
    <div class="live-dot"><span class="dot"></span> Live</div>
  </header>

  <!-- Date tabs -->
  <div class="date-tabs" id="dateTabs">
    <button class="dtab active" data-offset="0">Today</button>
    <button class="dtab" data-offset="1">Tomorrow</button>
  </div>

  <!-- Meal tabs -->
  <div class="meal-tabs" id="mealTabs">
    <button class="mtab active" data-meal="breakfast">🌅 Breakfast</button>
    <button class="mtab" data-meal="lunch">☀️ Lunch</button>
    <button class="mtab" data-meal="dinner">🌙 Dinner</button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-box green"><div class="stat-num" id="statEat">-</div><div class="stat-lbl">Will Eat</div></div>
    <div class="stat-box red">  <div class="stat-num" id="statSkip">-</div><div class="stat-lbl">Won't Eat</div></div>
    <div class="stat-box amber"><div class="stat-num" id="statPend">-</div><div class="stat-lbl">Not Voted</div></div>
    <div class="stat-box blue"> <div class="stat-num" id="statTotal">-</div><div class="stat-lbl">Total</div></div>
  </div>

  <!-- Status bar -->
  <div class="status-bar" id="statusBar"></div>

  <!-- Student list -->
  <div class="card" id="listCard">
    <div id="studentList"></div>
  </div>

  <p class="refresh-note">Auto-refreshing every 5s</p>
</div>
<script src="cook.js"></script>
</body>
</html>
